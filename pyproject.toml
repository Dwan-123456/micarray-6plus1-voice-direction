[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "micarray-6plus1-voice-direction"
version = "1.4.3"
description = "Minimal 6+1 microphone-array IMCRA, MUSIC DOA and spatial-ID runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.4,<2.5",
  "scipy>=1.17,<1.18",
  "PyYAML>=6.0,<7",
  "sounddevice>=0.5,<0.6",
  "pyserial>=3.5,<4",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
ui = [
  "PySide6>=6.10,<6.12",
]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "common*", "config*", "ingest*", "windowing*", "gui*", "layer1_input*", "layer2_source_detection*", "source_counting*"]

[tool.setuptools.package-data]
config = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "layer1_input/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
