sample_rate: 16000
repeat: 2
dropout: 0.1
kernel_size_factor: 1.0
labels:
- '0'
- '1'
train_ds:
  manifest_filepath:
  - /manifests/dav-vad/coswara_breath_cough_train_16k_manifest_abs.json
  - /manifests/dav-vad/ichbi_train_16k_manifest_abs.json
  - /manifests/dav-vad/train_vocalsound_abs.json
  - /manifests/dav-vad/freesound_train_manifest_nospch.json
  - /manifests/dav-vad/musan_train_manifest_nospch.json
  - /manifests/vad/white_noise_1ch_37h_drc_labels.json
  - /manifests/dav-vad/fisher500_train_synth_segments.json
  - /manifests/dav-vad/train_synth_segments_abs.json
  - /manifests/vad/icsi_all_40ms_cleaned.json
  - /manifests/vad/ami_train_40ms_cleaned.json
  - /manifests/vad/french_train_40ms_cleaned.json
  - /manifests/vad/german_train_40ms.json
  - /manifests/vad/mandarin_train_40ms_cleaned.json
  - /manifests/vad/russian_train_40ms.json
  - /manifests/vad/spanish_train_40ms_cleaned.json
  sample_rate: 16000
  labels:
  - '0'
  - '1'
  batch_size: 64
  shuffle: true
  is_tarred: false
  tarred_audio_filepaths: na
  tarred_shard_strategy: scatter
  shuffle_n: 2048
  num_workers: 8
  pin_memory: true
  bucketing_strategy: ''
  bucketing_batch_size: ''
  bucketing_weights: null
  augmentor:
    white_noise:
      prob: 0.9
      min_level: -90
      max_level: -46
    gain:
      prob: 0.8
      min_gain_dbfs: -20.0
      max_gain_dbfs: 10.0
    noise:
      prob: 0.6
      manifest_path:
      - /manifests/dav-vad/coswara_breath_cough_train_16k_manifest_abs.json
      - /manifests/dav-vad/ichbi_train_16k_manifest_abs.json
      - /manifests/dav-vad/train_vocalsound_abs.json
      - /manifests/vad/white_noise_1ch_37h_drc.json
      - /manifests/vad/freesound_nonspeech_train.json
      - /manifests/vad/musan_train.json
      min_snr_db: 0
      max_snr_db: 20
      max_gain_db: 300.0
validation_ds:
  manifest_filepath:
  - /manifests/dav-vad/freesound_dev_manifest_nospch_30.json
  - /manifests/dav-vad/musan_dev_manifest_nospch_30.json
  - /manifests/dav-vad/fisher5_dev_synth_segments.json
  - /manifests/dav-vad/dev_synth_segments_abs.json
  - /manifests/vad/ch120_moved_40ms.json
  - /manifests/vad/ami_dev_40ms.json
  - /manifests/vad/french_dev_40ms.json
  - /manifests/vad/german_dev_40ms.json
  - /manifests/vad/mandarin_dev_40ms_cleaned.json
  - /manifests/vad/russian_dev_40ms.json
  - /manifests/vad/spanish_dev_40ms.json
  sample_rate: 16000
  labels:
  - '0'
  - '1'
  batch_size: 64
  shuffle: false
  num_workers: 8
  pin_memory: true
  val_loss_idx: 0
preprocessor:
  _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
  normalize: None
  window_size: 0.025
  sample_rate: 16000
  window_stride: 0.01
  window: hann
  features: 80
  n_fft: 512
  frame_splicing: 1
  dither: 1.0e-05
  stft_conv: false
  pad_to: 2
spec_augment:
  _target_: nemo.collections.asr.modules.SpectrogramAugmentation
  freq_masks: 5
  time_masks: 5
  freq_width: 10
  time_width: 0.05
encoder:
  _target_: nemo.collections.asr.modules.ConvASREncoder
  feat_in: 80
  activation: relu
  conv_mask: true
  jasper:
  - filters: 128
    repeat: 1
    kernel:
    - 11
    stride:
    - 2
    dilation:
    - 1
    dropout: 0.1
    residual: false
    separable: true
    kernel_size_factor: 1.0
  - filters: 64
    repeat: 2
    kernel:
    - 13
    stride:
    - 1
    dilation:
    - 1
    dropout: 0.1
    residual: true
    separable: true
    kernel_size_factor: 1.0
  - filters: 64
    repeat: 2
    kernel:
    - 15
    stride:
    - 1
    dilation:
    - 1
    dropout: 0.1
    residual: true
    separable: true
    kernel_size_factor: 1.0
  - filters: 64
    repeat: 2
    kernel:
    - 17
    stride:
    - 1
    dilation:
    - 1
    dropout: 0.1
    residual: true
    separable: true
    kernel_size_factor: 1.0
  - filters: 128
    repeat: 1
    kernel:
    - 29
    stride:
    - 1
    dilation:
    - 2
    dropout: 0.1
    residual: false
    separable: true
    kernel_size_factor: 1.0
  - filters: 128
    repeat: 1
    kernel:
    - 1
    stride:
    - 1
    dilation:
    - 1
    dropout: 0.1
    residual: false
decoder:
  _target_: nemo.collections.common.parts.MultiLayerPerceptron
  hidden_size: 128
  num_classes: 2
  num_layers: 1
  activation: relu
  log_softmax: false
optim:
  name: sgd
  lr: 0.01
  weight_decay: 0.001
  momentum: 0.9
  sched:
    name: PolynomialHoldDecayAnnealing
    power: 2.0
    warmup_ratio: 0.05
    hold_ratio: 0.15
    min_lr: 1.0e-08
    last_epoch: -1
log_prediction: true
loss:
  weight: None
target: nemo.collections.asr.models.classification_models.EncDecFrameClassificationModel
nemo_version: 2.1.0rc0
