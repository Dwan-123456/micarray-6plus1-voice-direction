schema_version: project_config_v2

paths:
  data_root: data
  models_root: models

hardware:
  physical_mic_count: 7
  ring_radius_m: 0.04
  speed_of_sound_mps: 343.0
  geometry_version: r6plus1_mic_face_ccw_v1
  hardware_calibration_status: verified
  hardware_calibration_report_hash: 3b8a186010790916557c753fac31eca554f6746be2e67d7f5f97bb143894b3a2

device:
  sample_rate: 48000
  device_channels: 8
  pcm_format: s16-le
  layout: interleaved
  block_size_samples: 960
  physical_channel_map: [0, 1, 2, 3, 4, 5, 7]
  hardware_mix_channel: 6
  logical_channel_map: [0, 1, 2, 3, 4, 5, 7, 6]
  device_name: MicArray
  host_api: Windows WDM-KS
  serial_enabled: true
  serial_port: COM5
  serial_baud: 115200
  serial_required: false
  light_service_url: null

calibration:
  version: office_overhead_1m_20260824_v2
  correction_model: gain_polarity_integer_delay_v1
  gains: [1.069754, 1.034156, 1.100770, 1.056586, 1.093528, 1.056039, 0.673006]
  polarity: [1, 1, 1, 1, 1, 1, 1]
  delay_samples: [2, 1, 2, 0, 1, 0, 1]
  # Reserved versioned asset boundaries. Current L1 rejects non-null values
  # until fractional/frequency-domain correction is implemented and verified.
  fractional_delay_asset: null
  frequency_response_asset: null

timing:
  decision_hop_samples: 960
  doa_window_samples: 1920
  context_samples: 7680
  downstream_audio_window_ms: 40
  timestamp_tolerance_ms: 5

layer1_imcra:
  enabled: true
  # Cohen 2003 IMCRA core; 48 kHz/20 ms/7-mic aggregation is the L1 adapter.
  algorithm_version: cohen_imcra_2003_l1_v4
  hop_samples: 960
  n_fft: 2048
  window: hann_periodic
  output_frequency_min_hz: 0.0
  output_frequency_max_hz: 10000.0
  frequency_min_hz: 500.0
  frequency_max_hz: 4000.0
  # Paper Table I baseline. Recalibrating Bmin/window parameters requires a new version.
  frequency_smoothing_half_width: 1
  spectrum_smoothing: 0.90
  noise_smoothing: 0.85
  prior_snr_smoothing: 0.92
  minimum_subwindow_frames: 15
  minimum_history_subwindows: 8
  minimum_bias: 1.66
  gamma0: 4.60
  gamma1: 3.00
  zeta0: 1.67
  bias_compensation: 1.47
  warmup_seconds: 2.4
  eps: 1.0e-12

layer1_pre_denoise:
  # Development Test UI can change this switch before or during capture.
  enabled: false
  algorithm_version: imcra_wiener_wola_v3
  frame_samples: 1920
  hop_samples: 960
  n_fft: 2048
  frequency_max_hz: 10000.0
  window: sqrt_hann_50pct
  minimum_gain_db: -18.0
  gain_smoothing: 0.80

layer1_speaker_count:
  # Test-UI-only L1 sidecar. It never delays or changes the L1→Windowing path.
  enabled: false
  algorithm_version: countnet_crnn_5s_100ms_v3
  model_id: countnet_crnn_16k_5s_v2
  model_artifact: models/countnet_crnn_16k_5s_v2/model.pt
  model_sha256: f655f168bbd9091efd18b950e63484825ba68052a911331cab1e845e27e505e4
  input_sample_rate: 16000
  context_seconds: 5
  inference_hop_ms: 100
  output_classes: 3
  queue_blocks: 25
  # Official LibriCount audio is much louder than the calibrated array input.
  # Raise low-level, non-silent 5 s contexts without attenuating normal inputs.
  input_level_target_dbfs: -20.0
  input_level_floor_dbfs: -70.0
  maximum_input_gain_db: 30.0

layer2:
  # Average two aligned upstream 20 ms probabilities; `>=` opens the Gate.
  probability_gate:
    backend: mean_2x20ms_v1
    threshold: 0.60
  # L1/Windowing preparation for the future rolling MUSIC implementation.
  # MUSIC may emit DOA observations only after the Gate has remained OPEN for
  # one complete covariance context. Keep these durations synchronized.
  music:
    context_ms: 200
    comparison_context_ms: [160, 200, 240, 320]
    max_history_ms: 320
  # Circular IMM-JPDA direction tracking. The Test UI ID Track switch controls
  # this complete stage; there is no separate Kalman switch.
  direction_id_tracking:
    backend: circular_imm_jpda_v1
    association_gate_deg: 50.0
    association_chi2: 20.0
    max_velocity_dps: 60.0
    confirmation_observations: 5
    confirmation_window_ms: 200
    tentative_ttl_ms: 500
    coasting_ttl_ms: 2000
    probability_detect: 0.85
    probability_track: 0.80
    probability_new: 0.10
    probability_false: 0.10
    minimum_association_probability: 0.20
    minimum_birth_probability: 0.45
    confirmation_existence_probability: 0.70
    deletion_existence_probability: 0.05
    # Equivalent to retaining about 0.97 of confirmed-ID existence every 20 ms.
    survival_probability_per_second: 0.2180653753474073
    measurement_std_deg: 5.0
    stationary_angle_std_deg: 0.35
    stationary_velocity_std_dps: 3.0
    stationary_velocity_half_life_seconds: 0.15
    moving_angle_std_deg: 1.25
    moving_velocity_std_dps: 15.0
    moving_velocity_half_life_seconds: 0.50
    stationary_to_moving_probability: 0.02
    moving_to_stationary_probability: 0.05
    prediction_freeze_std_deg: 25.0
    duplicate_birth_guard_deg: 15.0
    max_active_tracks: 4
  scanner_backend: frequency_normalized_music
  angle_step_deg: 1.0
  # MUSIC定位只使用2～4 kHz；L1概率Gate仍独立使用500～4000 Hz。
  frequency_min_hz: 2000.0
  frequency_max_hz: 4000.0
  n_fft: 1024
  win_length: 960
  hop_length: 480
  window: hann_periodic
  context_ms: 200
  covariance_shrinkage: 0.05
  diagonal_loading: 1.0e-3
  eigenvalue_floor: 1.0e-10
  min_valid_frequency_bins: 12
  direction_threshold: 0.35
  peak_prominence: 0.05
  # L2候选间的最小圆周角距；低于该角距的较低分峰会被NMS抑制。
  min_peak_distance_deg: 50.0
  max_candidates: 3
  # Test UI changes this exact MUSIC subspace/search order to 1, 2, or 3.
  effective_order_limit: 2
  # Optional experimental safeguards. Both remain OFF until explicitly enabled
  # from Development Test UI; the manual ceiling remains independent.
  dpd_rank1_enabled: false
  dpd_min_eigenvalue_ratio: 1.50
  dpd_min_plane_wave_fit: 0.40
  dpd_min_frequency_support_ratio: 0.20
  dpd_angle_tolerance_deg: 15
  # Per-frequency rank-1 votes must form a real circular cluster rather than
  # only a relative peak in the fused map.
  dpd_min_cluster_frequency_bins: 4
  dpd_frequency_subbands: 4
  dpd_min_cluster_subbands: 2
  dpd_min_circular_concentration: 0.85
  # Merge individually strong DPD peaks before the final 50-degree NMS.
  dpd_peak_fusion_distance_deg: 40.0
  dpd_peak_fusion_min_normalized_score: 0.70
  noise_whitening_enabled: false
  noise_covariance_shrinkage: 0.10

stft:
  n_fft: 1024
  win_length: 960
  hop_length: 480
  window: hann_periodic
  center: true
  pad_mode: reflect
  normalized: false
  onesided: true
  return_complex: true

layer3:
  main_backend: imcra_spatial_separation
  fallback_backend: das
  frequency_min_hz: 80.0
  frequency_max_hz: 8000.0
  rho_lcmv_max: 0.30
  rho_soft_null_max: 0.70
  loading_retry_factors: [0.001, 0.01, 0.1]
  noise_covariance_shrinkage: 0.25
  uncertainty_loading_multiplier: 4.0
  alias_guard_hz: 4300.0
  alias_loading_multiplier: 3.0
  soft_null_strength: 2.0
  condition_number_limit: 1000000.0
  constraint_tolerance: 0.002
  min_frequency_gain: 0.25

layer4:
  enabled: true
  default_backend: mossformer2_ss_16k
  # Local, hash-verified model artifacts. Runtime and final reconciliation never download models.
  mossformer2_artifact: models/mossformer2_ss_16k_v1
  tiger_artifact: models/tiger_speech_16k_v1
  streaming:
    enabled: true
    # Tunable benchmark variable. The Test UI defaults to the measured 4 s balance point.
    chunk_seconds: 4
    overlap_seconds: 1
    queue_chunks: 2

feature:
  preprocessing_version: voice_logmag_v1
  frequency_min_hz: 80.0
  frequency_max_hz: 8000.0
  first_bin: 2
  last_bin_inclusive: 170
  log_epsilon: 1.0e-6
  normalization: training_set_per_frequency_zscore

layer5:
  primary_model_id: nv_marblenet_baseline_v1
  models:
    - model_id: nv_marblenet_baseline_v1
      backend: nvidia_marblenet_continuous_v2
      model_artifact: models/nv_marblenet_baseline_v1
      role: primary
      enabled: true
  allow_mock: false
  voice_probability_limit: 0.70
  continuous_context_ms: 3200
  input_gain_compensation:
    enabled: false
    algorithm_version: imcra_probability_rms_v1
    target_rms_dbfs: -23.0
    no_compensation_probability: 0.30
    full_compensation_probability: 0.80
    peak_ceiling_dbfs: -3.0
    silence_floor_dbfs: -100.0
    time_interpolation: linear_db

layer6:
  enabled: true
  campplus_artifact: models/campplus_zh_en_16k_v1
  dnsmos_artifact: models/dnsmos_p835_v1
  maximum_speakers: 5
  speaker_similarity_threshold: 0.62
  secondary_candidate_match_gap_max: 0.20
  secondary_candidate_match_min: 0.50
  secondary_candidate_mos_min: 0.30
  maximum_internal_silence_ms: 2000
  clustering_backend: multistage
  multistage_l: 30
  multistage_u1: 100
  multistage_u2: 600
  multistage_fallback_distance: 0.38
  # Bound 2 s content-addressed voiceprints; older segments are recomputed on demand.
  embedding_cache_max_segments: 600

runtime:
  mode: development
  # Legacy fallback for older profiles which do not define per-layer devices.
  preferred_device: cuda
  # L1/IMCRA and L2/MUSIC+ID are intrinsically CPU stages. The accelerated
  # downstream layers are independent. CPU remains the measured realtime L3
  # default; the bounded CUDA micro-batch path is available for explicit tests.
  l3_device: cpu
  l4_device: cuda
  l5_device: cpu
  # L1/L2 and candidate-independent L3 preparation stay responsive with one
  # intra-op CPU thread; L3 preparation, beamforming and stitching are already
  # separate pipeline workers.
  torch_cpu_threads: 1
  allow_cpu_fallback: true
  max_candidate_batch: 3
  # Ten seconds absorbs transient Windows/GPU/UI stalls without hiding a
  # sustained overload; depth/high-water/drop counters remain observable.
  capture_handoff_blocks: 500
  # Legacy serial-queue field retained for old launch profiles.
  processing_queue_windows: 1
  # Change this single value to resize all L2/L3/L5 latest-wins waiting queues.
  # 100 windows represent 2 s at 50 windows/s, bounding latency and RAM.
  stage_queue_windows: 100
  # If l3_device is explicitly changed to cuda, coalesce only an existing
  # backlog and never wait for a future window.
  l3_cuda_microbatch_windows: 4
  l3_cuda_batch_wait_ms: 0.0
  completion_queue_windows: 8
  # Per-stage queue overrides and max_inflight_windows are omitted deliberately;
  # Runtime derives 100/100/100 and 3*100+3=303 automatically.
  compute_cache_max_bytes: 67108864
  # Long-session L4-L6 audio is disk-spooled; keep resident work bounded and
  # surface a warning when its spool volume approaches the 5 GiB reserve.
  layer456_resident_memory_budget_bytes: 134217728
  layer456_spool_min_free_bytes: 5368709120
  overflow_policy: drop_oldest
  graceful_shutdown_timeout_seconds: 10.0

dev_test_ui:
  start_fullscreen: false
  stale_after_ms: 500
  performance_bar_height_px: 56
  performance_refresh_hz: 1
  performance_window_count: 500
  sample_rate_window_seconds: 5
  l1_meter_refresh_hz: 50
  polar_refresh_hz: 50
  waveform_refresh_hz: 10
  snapshot_mailbox_capacity: 1
  scratch_root: data/dev_test_ui/scratch/current
  autoplay: true
  loop_gap_ms: 100
  follow_latest_window: false
  preview_volume: 0.25
  preview_peak_dbfs: -6.0
  preview_fade_ms: 5
  default_selected_backend: mvdr
  # Hide Test-UI listening IDs until their stitched cache reaches this duration.
  minimum_listening_track_seconds: 2.0

recording:
  runtime:
    mode: manual
    chunk_seconds: 60
    audio_queue_seconds: 10
    result_queue_capacity: 256
    record_native_8ch: true
    record_logical_8ch: true
    record_physical_7ch: true
    record_physical_float32: true
    record_results_jsonl: true
    record_spatial_response: true
    record_hotmaps: true
    record_imcra: true
    # Deprecated compatibility asset; formal v0.3 noise data is the IMCRA sidecar.
    record_noise_spectrum: true
    retention_days: 30
    max_storage_gb: 200
    min_free_storage_gb: 5
  event:
    pre_roll_seconds: 2
    post_roll_seconds: 3
  trash_retention_days: 7

privacy:
  local_only: true
  automatic_upload: false
